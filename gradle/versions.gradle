def versions = [:]
versions.kotlin = "2.3.10"
versions.java = "21"
versions.aabresguard = "0.1.2026"
// android
versions.agp = "9.3.1"
versions.compileSdkVersion = 36
versions.minSdkVersion = 21
versions.targetSdkVersion = 36

versions["aabresguard-core"] = versions.aabresguard
versions["aabresguard-plugin"] = versions.aabresguard

// plugin
versions.shadow = "9.6.1"

ext.versions = versions

ext.deps = [:]

// kotlin
def kotlin = [:]
kotlin.stdlib = "org.jetbrains.kotlin:kotlin-stdlib:$versions.kotlin"
kotlin.plugin = "org.jetbrains.kotlin:kotlin-gradle-plugin:$versions.kotlin"
deps.kotlin = kotlin
// plugin
def plugin = [:]
plugin.shadow = "com.gradleup.shadow:shadow-gradle-plugin:${versions.shadow}"
deps.plugin = plugin

// aabresguard
def aabresguard = [:]
aabresguard.core = "$GROUP_ID:aabresguard-core:${versions["aabresguard"]}"
aabresguard.plugin = "$GROUP_ID:aabresguard-plugin:${versions["aabresguard"]}"
deps.aabresguard = aabresguard

ext.deps = deps
