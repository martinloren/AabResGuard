apply plugin: 'maven-publish'

def sourcesJar = tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
    archiveVersion = versions[ARTIFACT_ID]
}

def javadocJar = tasks.register('javadocJar', Jar) {
    dependsOn tasks.named('javadoc')
    archiveClassifier = 'javadoc'
    from javadoc
    archiveVersion = versions[ARTIFACT_ID]
}

def releasesRepoUrl = findProperty("RELEASE_REPOSITORY_URL")?.toString()
def snapshotsRepoUrl = findProperty("SNAPSHOT_REPOSITORY_URL")?.toString()
def publishUrl = versions[ARTIFACT_ID].endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

def pomConfig = {
    licenses {
        license {
            name "The Apache Software License, Version 2.0"
            url "http://www.apache.org/licenses/LICENSE-2.0.txt"
            distribution "repo"
        }
    }
    developers {
        developer {
            id pomInfo.developer.id
            name pomInfo.developer.name
            email pomInfo.developer.email
        }
    }
    scm {
        url pomInfo.repo.siteUrl
    }
}

publishing {
    publications {
        MyPublication(MavenPublication) { publication ->
            // Publish the self-contained shadow jar as the main artifact.
            // Deliberately NOT attached to a component: the fat jar embeds all
            // runtime dependencies, so the pom must stay dependency-free to
            // avoid leaking shaded libs (e.g. dom4j -> xpp3) onto consumers'
            // classpaths.
            artifact shadowJar
            groupId GROUP_ID
            artifactId ARTIFACT_ID
            version versions[ARTIFACT_ID]

            artifact sourcesJar
            artifact javadocJar

            pom.withXml {
                def root = asNode()
                root.appendNode('description', pomInfo.repo.description)
                root.appendNode('name', pomInfo.repo.name)
                root.appendNode('url', pomInfo.repo.siteUrl)
                root.children().last() + pomConfig
            }
        }
    }

    repositories {
        if (publishUrl?.trim()) {
            maven {
                url = publishUrl
                credentials {
                    username = findProperty("NEXUS_USERNAME")?.toString()
                    password = findProperty("NEXUS_PASSWORD")?.toString()
                }
            }
        }
        if ("true".equalsIgnoreCase(String.valueOf(findProperty("useLocalMaven")))) {
            maven {
                url = "${rootProject.projectDir}/repo"
            }
        }
    }
}
