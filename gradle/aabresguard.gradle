if (!"true".equalsIgnoreCase(String.valueOf(findProperty("enableAabResGuardPlugin")))) {
    return
}

apply plugin: "com.bytedance.android.aabResGuard"
aabResGuard {
    enableObfuscate = true
    // Opt-in: also obfuscate file names under assets/. Assets are referenced by
    // path at runtime, so every asset loaded via a path literal MUST be
    // whitelisted below or the app will crash at runtime.
    enableObfuscateAssets = true
    mappingFile = file("../mapping.txt").toPath()
    whiteList = [
            // keep resources
            "*.R.raw.*",
            "*.R.drawable.icon",
            "*.R.drawable.ic_*",
            "*.R.anim.abc*",
            "*.R.xml.actions",
            // keep resource file
            "*/res/xml/actions.xml",
            // keep asset files: the icon font libraries load these TTFs by path
            "*/assets/fonts/*",
    ]
    obfuscatedBundleFileName = "obfuscated-app.aab"
    mergeDuplicatedRes = false
    enableFilterFiles = true
    filterList = [
            "*/arm64-v8a/*"
    ]
    enableFilterStrings = true
    unusedStringPath = "core/src/test/resources/com/bytedance/android/aabresguard/demo/unused.txt"
    languageWhiteList = ["en", "zh"]
}
