apply plugin: 'com.android.application'
apply from: "$rootDir/gradle/aabresguard.gradle"
//apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.bytedance.android.app"
    compileSdk = 36

    defaultConfig {
        applicationId "com.bytedance.android.app"
        minSdkVersion versions.minSdkVersion
        targetSdkVersion versions.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    dynamicFeatures = [":df_module1", ":df_module2"]
//    kotlinOptions {
//        jvmTarget = '11'
 //   }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.startup:startup-runtime:1.2.0"

    implementation 'com.mikepenz:ionicons-typeface:2.0.1.5@aar'
    implementation 'com.mikepenz:pixeden-7-stroke-typeface:1.2.0.3@aar'
    implementation 'com.mikepenz:material-design-icons-dx-typeface:5.0.1.0-kotlin@aar'
    implementation 'androidx.core:core-ktx:1.17.0'
}
