buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "com.google.protobuf:protobuf-gradle-plugin:0.9.6"
    }
}

apply plugin: 'java-library'
apply plugin: "com.google.protobuf"
apply plugin: "com.gradleup.shadow"
apply from: rootProject.file('gradle/publish-shadow.gradle')

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        resolutionStrategy {
            force "com.android.tools.build:bundletool:1.18.3"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Must match the aapt2-proto version bundled with bundletool at runtime
    // (shadow configuration), otherwise compiled code can reference methods
    // that do not exist in the shaded jar (e.g. XmlNode.hasText in 9.x).
    compileOnly "com.android.tools.build:aapt2-proto:7.3.0-alpha07-8248216"
    compileOnly gradleApi()
 //   compile deps.gradle.agp

    implementation "androidx.annotation:annotation:1.9.1"
    implementation "com.google.protobuf:protobuf-java:3.21.12"
    shadow 'commons-io:commons-io:2.11.0'
    shadow 'commons-codec:commons-codec:1.15'
    shadow "com.google.guava:guava:33.0.0-jre"

    compileOnly "com.google.auto.value:auto-value-annotations:1.10.1"
    annotationProcessor "com.google.auto.value:auto-value:1.10.1"
    
    compileOnly "com.google.errorprone:error_prone_annotations:2.18.0"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    shadow "org.smali:dexlib2:2.5.2"
    shadow("org.dom4j:dom4j:2.1.3") {
        // Exclude dom4j's optional XML-ecosystem deps (XPath, StAX, JAXB, RNG
        // validation) — this tool only uses SAXReader. Several of them (xpp3,
        // pull-parser) ship javax.xml.parsers / org.xml.sax classes and JAXP
        // service registrations that hijack XML parsing on any classpath this
        // jar lands on (breaks AGP's resource merger).
        exclude group: "jaxen"
        exclude group: "xpp3"
        exclude group: "pull-parser"
        exclude group: "javax.xml.stream"
        exclude group: "javax.xml.bind"
        exclude group: "net.java.dev.msv"
    }
    shadow "com.android.tools.build:bundletool:1.18.3"

    testImplementation "org.smali:dexlib2:2.5.2"
    testImplementation "com.android.tools.build:gradle:8.2.2"
    testImplementation "com.android.tools.build:bundletool:1.18.3"
    testImplementation "com.android.tools.build:aapt2-proto:7.3.0-alpha07-8248216"
    testImplementation group: 'org.dom4j', name: 'dom4j', version: '2.1.3'
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.2"
    testImplementation "com.google.guava:guava:33.0.0-jre"
    testImplementation "org.mockito:mockito-core:5.1.1"
    testImplementation "com.google.truth.extensions:truth-java8-extension:1.1.3"
    testImplementation "com.google.truth.extensions:truth-proto-extension:1.1.3"
    testImplementation "com.google.auto.value:auto-value-annotations:1.10.1"
    testAnnotationProcessor "com.google.auto.value:auto-value:1.10.1"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.12"
    }
}

shadowJar {
    archiveBaseName = "AabResGuard"
    version = versions[ARTIFACT_ID]
    archiveClassifier = ''

    minimize()

    from sourceSets.main.output
    configurations = [
            project.configurations.shadow
    ]
    manifest {
        attributes 'Main-Class': 'com.bytedance.android.aabresguard.AabResGuardMain'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    // Service registrations from shaded third-party jars must not leak onto the
    // consuming build's classpath: ServiceLoader would pick them up JVM-wide and
    // break AGP's own XML/resource parsing (e.g. xpp3's SAXParserFactory does not
    // support standard SAX features).
    exclude 'META-INF/services/javax.xml.**'
    exclude 'META-INF/services/org.xml.**'
    exclude 'META-INF/services/org.w3c.**'
    exclude 'META-INF/services/org.xmlpull.**'
    exclude 'META-INF/services/org.gjt.xpp.**'
    exclude 'META-INF/services/org.relaxng.**'
    exclude 'META-INF/services/com.android.tools.r8.**'

    relocate 'com.android', 'shadow.bytedance.com.android'
    relocate 'com.google', 'shadow.bytedance.com.google'
}

java {
    sourceCompatibility = versions.java
    targetCompatibility = versions.java
}
