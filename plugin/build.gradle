apply plugin: 'java-library'
apply plugin: 'kotlin'
apply plugin: "groovy"
apply from: rootProject.file('gradle/publish.gradle')

// Ensure the main jar task uses the same version as the publication artifacts.
version = versions[ARTIFACT_ID]

def useSource = "true".equalsIgnoreCase(String.valueOf(findProperty("useSource")))

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation gradleApi()
    implementation localGroovy()
    compileOnly "com.android.tools.build:gradle:${versions.agp}"

    implementation deps.kotlin.stdlib
    implementation deps.kotlin.plugin

    if (useSource) {
        implementation project(":core")
    } else {
        // The task action executes ObfuscateBundleCommand in the plugin runtime
        // process, so the core API must be available on the runtime classpath.
        // Keeping it as compileOnly makes the plugin compile cleanly but leaves
        // the command class unresolved when the task actually runs.
        implementation(deps.aabresguard.core) {
            exclude group: "com.google.guava", module: "guava"
            exclude group: "com.android.tools.build", module: "gradle"
        }
    }
}

// core shades bundletool into its own shadow jar; it must not leak into the
// plugin's runtime classpath.
configurations.named("runtimeClasspath") {
    exclude group: "com.android.tools.build", module: "bundletool"
}

java {
    sourceCompatibility = versions.java
    targetCompatibility = versions.java
}
