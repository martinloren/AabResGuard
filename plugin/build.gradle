apply plugin: 'java-library'
apply plugin: 'kotlin'
apply plugin: "groovy"
apply from: rootProject.file('gradle/publish.gradle')

def useSource = "true".equalsIgnoreCase(String.valueOf(findProperty("useSource")))

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation gradleApi()
    implementation localGroovy()
    compileOnly "com.android.tools.build:gradle:${versions.agp}"

    implementation deps.kotlin.stdlib
    implementation deps.kotlin.plugin

    if (useSource) {
        implementation project(":core")
    } else {
        compileOnly deps.aabresguard.core
        api(deps.aabresguard.core) {
            exclude group: "com.google.guava", module: "guava"
            exclude group: "com.android.tools.build", module: "gradle"
        }
    }
}

// core shades bundletool into its own shadow jar; it must not leak into the
// plugin's runtime classpath.
configurations.named("runtimeClasspath") {
    exclude group: "com.android.tools.build", module: "bundletool"
}

java {
    sourceCompatibility = versions.java
    targetCompatibility = versions.java
}
