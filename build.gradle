// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: rootProject.file("gradle/config.gradle")

    def useLocalMaven = "true".equalsIgnoreCase(String.valueOf(findProperty("useLocalMaven")))

    repositories {
        google()
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
        if (useLocalMaven) {
            mavenLocal()
        } else {
            [findProperty("RELEASE_REPOSITORY_URL"), findProperty("SNAPSHOT_REPOSITORY_URL")].each { repoUrl ->
                if (repoUrl?.toString()?.trim()) {
                    maven { url = repoUrl }
                }
            }
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${versions.agp}"
        classpath deps.kotlin.plugin
        classpath deps.plugin.shadow

        if ("true".equalsIgnoreCase(String.valueOf(findProperty("enableAabResGuardPlugin")))) {
            classpath deps.aabresguard.plugin
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        if ("true".equalsIgnoreCase(String.valueOf(findProperty("useLocalMaven")))) {
            mavenLocal()
        } else {
            [findProperty("RELEASE_REPOSITORY_URL"), findProperty("SNAPSHOT_REPOSITORY_URL")].each { repoUrl ->
                if (repoUrl?.toString()?.trim()) {
                    maven { url = repoUrl }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
